[plugin]
id = "heroic-steam-install"
name = "Heroic Install"
version = "0.1.0"
author = "WSeubring"
description = "Install button, download progress and greyed-out rows for Epic and GOG games synced by steam-heroic-library."

[assets]
resources = ["resources/**/*"]

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[compiler]
output_path = "auto"

[dev]
auto_restart = true
reload_steamui_when = "both"

[logger]
backend_prefix  = "BCK"
frontend_prefix = "FRT"
